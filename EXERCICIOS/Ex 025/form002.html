<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
    <style>
        *{
            font-family: Arial, Helvetica, sans-serif;
        }
    </style>
</head>
<body>
    <h1>Formulario</h1>
    <form action="cadastro.php" method="post" autocomplete="off">
        <p>
            <label for="iuso">
                Usuario: <input type="text" name="usuario" id="iusuario" required minlength="5" maxlength="15" size="30" placeholder="Nome do usuario" autocomplete="username">
            </label>
        </p>
        <p>
            <label for="senha">
                Senha: <input type="password" name="senha" id="isenha" required minlength="8" maxlength="20" placeholder="Minimo 8 letras" autocomplete="current-password">
            </label>
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
