<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        table{
            border-collapse: collapse;
        }
        th, td{
            width: 100px;
            margin: 0px;
            border: 1px solid black;
            padding: 10px;
        }
        thead>tr>th{
            background-color: gray;
            color: white;
            height: 70px;
        }
        .media{
            background-color: gray;}
    </style>
</head>
<body>
    <table>
        <tfoot>
            <th colspan="4">Média de Humanas</th>
            <td>0.0</td>
        </tfoot>
        <thead>
            <tr>
                <th scope="colgroup">Área</th>
                <th scope="colgroup">Disciplinas</th>
                <th colspan="2">Notas</th>
                <th>Média</th>
            </tr>
        </thead>
        <tbody>

            <tr>
                <th rowspan="4">Exatas</th>
                <td>Matemática</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td>Fisica</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td>Quimica</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td>Biologia</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>

            <tr>
                <div class="media">
                    <th colspan="4">Média de Exatas</th>
                <td>0.0</td>
                </div>
            </tr>
            <tr>
                <div class="media">
                    <th rowspan="2">Humanas</th>
                </div>
                <td>história</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td>Geografia</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
